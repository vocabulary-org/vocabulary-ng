name: Deploy Angular to Azure Static Web Apps

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vocabulary-ng

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vocabulary-ng/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (configuration=azure)
        run: npx ng build --configuration=azure

      - name: Deploy
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          app_location: "vocabulary-ng"
          output_location: "vocabulary-ng/dist/vocabulary-ng" # adjust if your outputPath differs
          skip_app_build: true

      # Example github-script step (only if you really need it)
      - name: Post a small note
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            core.info('Deployment step finished');
