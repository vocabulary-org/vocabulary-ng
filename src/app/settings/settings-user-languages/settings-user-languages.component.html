<div class="card shadow-sm">
  <div class="card-header bg-light">
    <h5 class="mb-0">User Language Settings</h5>
  </div>

  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-6">
        <label for="language-select" class="form-label fw-bold">From Language</label>
        <div class="input-group">
          <select id="language-select" class="form-select"
           [disabled]="!editing()"
           (change)="onFromChange($event)">
            <option value="">-- Select Language --</option>
            @for (l of languages(); track l.uuid) {
              <option
                [value]="l.uuid"
                [selected]="l.uuid === model().language?.uuid"
                
              >
                {{ l.name }}
              </option>
            }
          </select>
        </div>
      </div>

      <div class="col-md-6">
        <label for="languageTo-select" class="form-label fw-bold"
          >To Language</label
        >
        <select id="languageTo-select" class="form-select" 
        [disabled]="!editing()"
        (change)="onToChange($event)">
          <option value="">-- Select Language --</option>
          @for (l of languages(); track l.uuid) {
            <option
              [value]="l.uuid"
              [selected]="l.uuid === model().languageTo?.uuid"
              
            >
              {{ l.name }}
            </option>
          }
        </select>
      </div>
    </div>

    <div class="mt-3">
      @if (saving()) {
        <div class="text-primary d-flex align-items-center">
          <div
            class="spinner-border spinner-border-sm me-2"
            role="status"
          ></div>
          <span>Saving changes...</span>
        </div>
      }

      @if (saved()) {
        <div class="alert alert-success py-2 mt-2" role="alert">
          <i class="bi bi-check-circle-fill me-2"></i> Preferences updated!
        </div>
      }

      @if (error()) {
        <div class="alert alert-danger py-2 mt-2" role="alert">
          {{ error() }}
        </div>
      }
    </div>
  </div>

  <!-- Buttons -->
  <div class="col-12 d-flex gap-2 mt-2">
    @if (!editing()) {
      <button class="btn btn-outline-primary" (click)="enableEdit()">
        Edit
      </button>
    } @else {
      <button class="btn btn-primary" (click)="save()">
        Save
      </button>

      <button class="btn btn-outline-secondary" (click)="cancel()" [disabled]="saving()">
        Cancel
      </button>
    }
  </div>

</div>
