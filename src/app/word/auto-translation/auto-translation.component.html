<button mat-stroked-button type="button" color="accent" class="rounded-pill d-inline-flex align-items-center justify-content-center gap-1 btn btn-outline-primary cursor-pointer"
  (click)="autoTranslate()" [disabled]="!canTranslate()">
  @if (isTranslating) {
    <span class="d-inline-flex align-items-center gap-1">
      <mat-icon>sync</mat-icon>
      Translating...
    </span>
  } @else {
    <span class="d-inline-flex align-items-center gap-1">
      <mat-icon>auto_awesome</mat-icon>
      Auto translate
    </span>
  }
</button>

@if (isQuotaReached) {
<small class="text-muted d-block mt-1">
  Translation quota reached for this month.
</small>
}

@if (message) {
<div class="alert alert-danger py-2 mt-2 mb-0" role="alert">
  {{ message }}
</div>
}
