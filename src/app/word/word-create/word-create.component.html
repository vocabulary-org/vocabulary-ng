<form [formGroup]="form" (ngSubmit)="onSubmit()" class="container mt-4">
  <h2 class="mb-4">Add New Word</h2>

  <!-- Sentence -->
  <div class="mb-3">
    <label for="sentence" class="form-label">Sentence</label>
    <input
      id="sentence"
      type="text"
      [formControl]="form.controls.sentence"
      class="form-control"
    />
    @if (sentenceIsInvalid) {
      <div class="text-danger small">Please enter a valid Sentence</div>
    }
  </div>

  <!-- Translation -->
  <div class="mb-3">
    <label for="translation" class="form-label">Translation</label>
    <input
      id="translation"
      type="text"
      formControlName="translation"
      class="form-control"
    />
    @if (translationIsInvalid) {
      <div class="text-danger small">Please enter a valid Translation</div>
    }
  </div>

  <!-- Submit -->
  <button type="submit" class="btn btn-primary">Add Word</button>
</form>
