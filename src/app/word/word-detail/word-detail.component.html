<div class="container my-4">
  @if (word) {
  <div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Word Details</h5>
    </div>

    <div class="card-body">
      <!-- Languages -->
      <p class="mb-1 text-end">
        <span>
          {{ flags[word.language.name] }}
          {{ flags[word.languageTo.name] }}
        </span>
      </p>

      <!-- Sentence & Translation -->
      <h3 class="card-title text-dark">
        {{ word.sentence }}
      </h3>
      <h5 class="card-subtitle mb-3 text-muted">
        Translation: <span class="fw-semibold">{{ word.translation }}</span>
      </h5>

      <!-- Description -->
       @if (word.description.trim()) {
              <p class="mt-3">
        <strong>Description:</strong><br />
        {{ word.description }}
      </p>

       }


    </div>
  </div>
  } @else {
  <div class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2">Loading word details...</p>
  </div>
  }
</div>
