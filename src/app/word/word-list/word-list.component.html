<div class="container mt-4">
  <main>

    @if (words.length === 0) {
      <div class="alert alert-warning">No words found.</div>
    } @else {

      <div class="card shadow-sm">
        <div class="card-header">
          <h5 class="mb-0">Words</h5>
        </div>

        <ul class="list-group list-group-flush">
          @for (word of words; track word.uuid) {
            <li class="list-group-item d-flex justify-content-between align-items-start">
              <div class="me-3">
                <div class="fw-semibold">{{ word.sentence }}</div>
                <div class="text-muted small">{{ word.translation }}</div>
                <div class="text-muted small">{{ word.uuid }}</div>
              </div>
              <span class="badge text-bg-secondary">
                {{ word.language }} → {{ word.languageTo }}
              </span>
            </li>
          }
        </ul>
      </div>

    }
  </main>
</div>
